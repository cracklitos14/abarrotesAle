<div class="historial-section">
  <div class="d-flex justify-content-between align-items-end mb-4">
    <h3 class="fw-bold" style="font-size: 20px; color: #1e293b; margin: 0;">Historial de Cierres</h3>
    
    <div class="filtros-container" style="display: flex; gap: 10px; align-items: flex-end;">
      <div class="filter-group">
        <label style="display: block; font-size: 12px; color: #64748b;">Desde:</label>
        <input type="date" [(ngModel)]="inicio" [max]="today | date:'yyyy-MM-dd'" class="form-control form-control-sm">
      </div>
      
      <div class="filter-group">
        <label style="display: block; font-size: 12px; color: #64748b;">Hasta:</label>
        <input type="date" [(ngModel)]="fin" [min]="inicio" [max]="today | date:'yyyy-MM-dd'" class="form-control form-control-sm">
      </div>

      <button class="btn btn-primary btn-sm" (click)="cargarHistorial()">
        🔍 Filtrar
      </button>

      <button class="btn btn-outline-secondary btn-sm" (click)="limpiarFiltrosYTabla()">
        🧹 Limpiar
      </button>

      <button class="btn btn-dark btn-sm" (click)="exportarPDF()" [disabled]="historial.length === 0">
        📂 Exportar Todo
      </button>
    </div>
  </div>

  <div class="table-card">
    <table class="table table-hover align-middle mb-0" *ngIf="historial.length > 0">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Venta Total</th>
          <th>Diferencia</th>
          <th class="text-end">Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of historial">
          <td>{{ c.fecha }}</td>
          <td>{{ c.total_ventas | currency:'MXN' }}</td>
          <td [ngClass]="c.diferencia < 0 ? 'text-danger' : 'text-success'">
            {{ c.diferencia | currency:'MXN' }}
          </td>
          <td class="text-end">
            <button class="btn-pdf-row" (click)="exportarCierrePDF(c)">
              PDF 📄
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="historial.length === 0" class="text-center py-4 text-muted">
      No hay registros cargados. Usa los filtros para buscar cierres anteriores.
    </div>
  </div>
</div>
